name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No package lockfile is committed yet; install dependencies without cache.
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
