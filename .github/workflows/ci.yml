name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile newsroom scripts
        run: python -m compileall -q tools/news_desk
      - name: Test newsroom feed parser and editorial gate
        run: python -m unittest discover -s tools/news_desk -p 'test_*.py' -v
      - name: Compile video pipeline
        run: python -m compileall -q tools/free_video_pipeline
      - name: Test video renderer
        run: python -m unittest discover -s tools/free_video_pipeline -p 'test_*.py' -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No package lockfile is committed yet; install dependencies without cache.
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
