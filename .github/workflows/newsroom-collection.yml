name: Scheduled newsroom lead collection

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: newsroom-lead-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect RSS and Atom leads
        id: collect
        shell: bash
        run: |
          set +e
          python tools/news_desk/rss_brief.py
          result=$?
          echo "collector_exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ -f output/news-desk/news_brief.json ]; then
            python tools/news_desk/prepare_review_queue.py
          fi
          exit "$result"

      - name: Preserve newsroom brief for editor review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-leads-${{ github.run_id }}
          path: |
            output/news-desk/news_brief.json
            output/news-desk/news_brief.md
            output/news-desk/review_queue.json
          if-no-files-found: warn
          retention-days: 7
