name: Source backup archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          git archive --format=zip --output="global-funn-live-news-${GITHUB_SHA}.zip" HEAD
      - name: Store source archive
        uses: actions/upload-artifact@v4
        with:
          name: global-funn-live-news-source-${{ github.sha }}
          path: global-funn-live-news-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90
